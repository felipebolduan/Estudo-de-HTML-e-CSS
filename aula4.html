<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 4</title>

    <style>
        /*Para selecionar uma TAG*/
        h1 {
            background-color: antiquewhite;
        }

        /*Para selecionar o ID*/
        #titulo-um {
            background-color: blue;
        }

        /*Para selecionar uma classe*/
        .titulos {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h1 id="titulo-um" class="titulos bordas">Titulo 1</h1>
    <h1 id="titulo-dois" class="titulos bordas">Titulo 2</h1>
</body>

</html>
